<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NRAtölye • Neo His Evreni</title>
<style>
  :root{
    --bg:#0e1217; --card:#141a22; --ink:#ffffff;
    --muted:#aeb8c6; --line:#1f2733;
    --chip:#18212c; --chip-hover:#1f2a39; --chip-active:#253448;
    --copy:#22c55e; --match:#29405a; --fav:#f1c40f; --danger:#ef4444;
    --accent:#4ea9ff; --dark-modal: #0b0f13;
  }
  *{box-sizing:border-box; scroll-behavior: smooth;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,sans-serif;}
  
  @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
  .error-shake { animation: shake 0.3s ease-in-out; border-color: var(--danger) !important; }

  .brand-container { display:flex; align-items:center; justify-content:center; gap:20px; margin:40px 0 10px; }
  .main-logo { width:80px; height:80px; object-fit:contain; animation:pulseGlow 3s infinite ease-in-out; }
  @keyframes pulseGlow { 0%,100%{transform:scale(1);filter:drop-shadow(0 0 5px rgba(78,169,255,0.3));} 50%{transform:scale(1.1);filter:drop-shadow(0 0 15px rgba(78,169,255,0.6));} }
  .brand-title { font-size:32px; font-weight:900; margin:0; background:linear-gradient(180deg,#fff,#aeb8c6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .slogan-top { text-align:center; color:var(--muted); margin-bottom:30px; font-size:14px; }

  .wrap{max-width:1200px; margin:0 auto 36px; padding:0 14px}
  .cats, .actions { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:15px 0 }
  .catbtn, .actionBtn {
    appearance:none; border:1px solid var(--line); background:#0f1620; color:var(--ink);
    padding:10px 16px; border-radius:14px; cursor:pointer; font-size:14px; font-weight:600; transition:0.2s;
  }
  .catbtn.active { background:var(--match); border-color:var(--accent); }

  .previews{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:20px 0}
  @media(max-width:860px){.previews{grid-template-columns:1fr}}
  .prev{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; position:relative; min-height:95px;}
  .prev small{position:absolute; top:10px; left:14px; color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase;}
  .prev .val{font-size:17px; margin-top:30px; color:var(--ink); font-weight:500}
  .btn-group{position:absolute; right:10px; top:8px; display:flex; gap:5px}
  .copybtn, .managebtn{font-size:11px; padding:5px 10px; background:#1a232e; border:1px solid var(--line); border-radius:8px; color:var(--ink); cursor:pointer}

  .search-wrap{position:relative; margin:10px 0;}
  #q{width:100%; background:var(--card); color:#fff; border:1px solid var(--line); padding:15px 100px 15px 15px; border-radius:12px; outline:none;}
  .clear-btn{position:absolute; right:15px; top:50%; transform:translateY(-50%); background:var(--line); border:1px solid var(--line); color:var(--ink); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:11px; display:none}
  #rcStatus{text-align:right; color:var(--muted); font-size:12px; margin-top:5px; display:block;}

  .pool { border:1px dashed #2a3444; border-radius:20px; padding:18px; background:rgba(20,26,34,0.4); position:relative; }
  .chips { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-height:500px; overflow:auto; padding-right:5px; }
  @media(max-width:780px){.chips{grid-template-columns:repeat(2,1fr)}}
  
  .chip { background:var(--chip); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; align-items:center; gap:10px; cursor:pointer; transition:0.2s; }
  .chip:hover { background:var(--chip-hover); border-color:var(--muted); }
  .chip.pinned { border-color:var(--accent); background:var(--chip-active); outline:2px solid #4ea9ff33; }
  .fav-star { margin-left:auto; opacity:0.2; }
  .fav-star.is-fav { opacity:1; color:var(--fav); }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:1000; backdrop-filter:blur(5px); }
  .modal { background:#0f141a; border:1px solid rgba(255,255,255,0.08); border-radius:28px; width:95%; max-width:500px; padding:30px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.7); }
  .modal label { display:block; color:#aeb8c6; font-size:12px; font-weight:800; letter-spacing:0.8px; margin-bottom:10px; margin-top:15px; text-transform:uppercase; }
  .modal input, .modal select { width:100%; background:#1a222c !important; border:1px solid #2a3441 !important; border-radius:16px !important; padding:16px !important; color:#fff !important; font-size:15px; margin-bottom:8px; transition:0.3s; }
  .modal input:focus { border-color:var(--accent) !important; background:#1e2936 !important; box-shadow:0 0 0 4px rgba(78,169,255,0.15); }

  .deriv-list { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:15px 0; max-height:200px; overflow-y:auto; }
  .deriv-item { background:#161b22; padding:10px; border-radius:10px; border:1px solid var(--line); font-size:13px; display:flex; align-items:center; gap:5px; cursor:pointer; }
  #poolScrollTop { display:none; position:absolute; right:20px; bottom:20px; background:var(--accent); color:#000; width:35px; height:35px; border-radius:10px; cursor:pointer; z-index:10; align-items:center; justify-content:center; font-weight:bold; }
  #toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--accent); color:#000; padding:12px 25px; border-radius:50px; font-weight:800; display:none; z-index:9999; }
</style>
</head>
<body>

<div class="brand-container">
    <img src="NRAtölyelogo.png" alt="Logo" class="main-logo" onerror="this.style.opacity='0.2'">
    <h1 class="brand-title">NRAtölye • Neo His Evreni</h1>
</div>
<div class="slogan-top">Videonuzun İnternette Bulunmasının En Kolay Yolu</div>

<div class="wrap">
  <div class="cats" id="cats">
    <button class="catbtn active" data-cat="all">🪶 Tümü</button>
    <button class="catbtn" data-cat="kalp">💞 Duygular • Kalp Evreni</button>
    <button class="catbtn" data-cat="vatan">🇹🇷͜͜͡͡✯ Vatan Sevdalısı</button>
    <button class="catbtn" data-cat="muzik">🎶 Müzik • Ses Evreni</button>
    <button class="catbtn" data-cat="atmosfer">🍃 Ambiyans • Doğanın Dili</button>
    <button class="catbtn" data-cat="doku">🍂 Doku • Duyusal Hisler</button>
    <button class="catbtn" data-cat="mevsim">🌿 Mevsimler • Doğa Evreni</button>
    <button class="catbtn" data-cat="genel">📜 Genel</button>
  </div>

  <div class="actions">
    <button class="actionBtn" onclick="openModal('addModal')">➕ Yeni His</button>
    <button class="actionBtn" id="btnFavFilter" onclick="toggleFavFilter()">⭐ Favoriler</button>
    <button class="actionBtn" onclick="showDerivativesMenu()">🌱 Türev Üret</button>
    <button class="actionBtn" style="color:var(--accent)" onclick="pickRandomFeel()">🎲 Rastgele Seç</button>
    <button class="actionBtn" onclick="document.getElementById('xlsxInput').click()">📥 İçe Aktar</button>
    <button class="actionBtn" onclick="exportXLSX()">📤 Dışa Aktar</button>
    <button class="actionBtn" style="color:var(--danger)" onclick="resetSystemPrompt()">🔄 Sistemi Sıfırla</button>
  </div>

  <div class="previews">
    <div class="prev"><small>Seçili His</small><div class="val" id="p1v">—</div>
      <div class="btn-group">
        <button class="managebtn" id="btnManage" style="display:none" onclick="openEditModal()">⚙️</button>
        <button class="copybtn" onclick="copy('p1v')">📋 Kopyala</button>
      </div>
    </div>
    <div class="prev"><small>Başlık Formatı</small><div class="val" id="p2v">—</div><div class="btn-group"><button class="copybtn" onclick="copy('p2v')">📋</button></div></div>
    <div class="prev"><small>Açıklama Formatı</small><div class="val" id="p3v">—</div><div class="btn-group"><button class="copybtn" onclick="copy('p3v')">📋</button></div></div>
  </div>

  <div class="search-wrap">
    <input id="q" placeholder="Hislerde ara..." oninput="applyFilters()" />
    <button class="clear-btn" id="clearSearch" onclick="clearInput()">Temizle ✕</button>
    <span id="rcStatus">Yükleniyor...</span>
  </div>

  <div class="pool">
    <div id="poolScrollTop" onclick="scrollPoolToTop()">↑</div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div class="modal-overlay" id="alertModal">
    <div class="modal" style="text-align:center;">
      <div id="alertIcon" style="font-size:50px; margin-bottom:10px;">⚠️</div>
      <h3 id="alertTitle">Uyarı</h3>
      <p id="alertMsg" style="color:var(--muted); margin-bottom:20px; line-height:1.5;"></p>
      <button class="actionBtn" style="width:100%; background:var(--accent); color:#000;" onclick="closeModals()">Anladım</button>
    </div>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>✨ Yeni His Ekle</h3>
    <label>SİMGE / EMOJİ</label>
    <input type="text" id="newEmoji" placeholder="Örn: 🕊️">
    <label>HİS BAŞLIĞI</label>
    <input type="text" id="newTitle" placeholder="His başlığını yazın...">
    <label>KATEGORİ</label>
    <select id="newCat">
        <option value="kalp">Duygular • Kalp Evreni</option>
        <option value="vatan">Vatan Sevdalısı</option>
        <option value="muzik">Müzik • Ses Evreni</option>
        <option value="atmosfer">Ambiyans • Doğanın Dili</option>
        <option value="doku">Doku • Duyusal Hisler</option>
        <option value="mevsim">Mevsimler • Doğa Evreni</option>
        <option value="genel">Genel</option>
    </select>
    <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="actionBtn" style="flex:2; background:var(--copy); color:#000;" onclick="saveNew()">💾 Ekle</button>
        <button class="actionBtn" style="flex:1;" onclick="closeModals()">Kapat</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>⚙️ Hissi Düzenle</h3>
    <label>SİMGE</label>
    <input type="text" id="editEmoji">
    <label>HİS BAŞLIĞI</label>
    <input type="text" id="editTitle">
    <label>KATEGORİ TAŞI</label>
    <select id="editCat">
        <option value="kalp">Duygular • Kalp Evreni</option>
        <option value="vatan">Vatan Sevdalısı</option>
        <option value="muzik">Müzik • Ses Evreni</option>
        <option value="atmosfer">Ambiyans • Doğanın Dili</option>
        <option value="doku">Doku • Duyusal Hisler</option>
        <option value="mevsim">Mevsimler • Doğa Evreni</option>
        <option value="genel">Genel</option>
    </select>
    <div style="display:grid; gap:10px; margin-top:20px;">
        <button class="actionBtn" style="background:var(--copy); color:#000;" onclick="updateFeel()">💾 Güncelle</button>
        <button class="actionBtn" style="background:var(--danger); color:#fff;" onclick="deleteFeel()">🗑️ Sil</button>
        <button class="actionBtn" onclick="closeModals()">Kapat</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal" style="text-align:center;">
    <div id="confirmIcon" style="font-size:50px; margin-bottom:10px;">❓</div>
    <h3 id="confirmTitle">Emin misiniz?</h3>
    <p id="confirmMsg" style="color:var(--muted); margin-bottom:20px; line-height:1.5;"></p>
    <div style="display:flex; gap:12px;">
        <button id="confirmYesBtn" class="actionBtn" style="flex:1; background:var(--danger); color:#fff;">Evet, Onayla</button>
        <button class="actionBtn" style="flex:1;" onclick="closeModals()">Hayır, Vazgeç</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="derivModal">
    <div class="modal">
        <h3>🌱 Türev Üret</h3>
        <div class="deriv-list" id="derivList"></div>
        <button class="actionBtn" style="width:100%; background:var(--copy); color:#000" onclick="addSelectedDerivatives()">✅ Aktar</button>
        <button class="actionBtn" style="width:100%; margin-top:10px;" onclick="closeModals()">İptal</button>
    </div>
</div>
<div id="reportModal" class="modal-overlay">
  <div class="modal" style="max-width: 400px; padding: 2rem;">
    <div id="reportIcon" style="font-size:3.5rem; margin-bottom:1rem; filter: drop-shadow(0 0 10px var(--accent));">📊</div>
    <h2 id="reportTitle" style="margin-bottom: 0.5rem;">İşlem Özeti</h2>
    <div id="reportContent" style="text-align:left; background:var(--bg); padding:1.5rem; border-radius:16px; margin:1.5rem 0; border:1px solid var(--line); line-height:1.6; font-size: 0.95rem;">
      </div>
    
    <button class="btn" onclick="closeModals()" 
      style="width:100%; height: 50px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(78, 169, 255, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px;">
      <span>Tamamdır</span>
      <span style="font-size: 1.2rem;">✨</span>
    </button>
  </div>
</div>
<div id="toast">Kopyalandı!</div>
<input type="file" id="xlsxInput" accept=".xlsx" style="display:none" onchange="importXLSX(this)">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

function prepareInitialFeels() {
    let initial = [];
    let idCounter = 0;
    // RAW_DATA içindeki tüm kategorileri (kalp, vatan, genel vb.) sırayla döner
    for (let cat in RAW_DATA) {
        RAW_DATA[cat].forEach(item => {
            // Eğer aynı isimde his daha önce eklenmemişse listeye ekle
            if (!initial.some(x => x.t.toLowerCase() === item[1].toLowerCase())) {
                initial.push({
                    id: ++idCounter, 
                    e: item[0], 
                    t: item[1], 
                    c: cat, // Burası RAW_DATA'daki anahtarı (genel, kalp vb.) alır
                    fav: false
                });
            }
        });
    }
    return initial;
}
let FEELS = JSON.parse(localStorage.getItem(LS_KEY)) || prepareInitialFeels();
let pinnedId = null, activeCat = 'all', favOnly = false;

function save() { localStorage.setItem(LS_KEY, JSON.stringify(FEELS)); }

function showAlert(title, msg, icon = "⚠️") {
    document.getElementById('alertTitle').innerText = title;
    document.getElementById('alertMsg').innerText = msg;
    document.getElementById('alertIcon').innerText = icon;
    openModal('alertModal');
}

function render() {
  const container = document.getElementById('chips');
  container.innerHTML = '';
  
  // Alfabetik sırala
  const displayList = [...FEELS].sort((a,b) => a.t.localeCompare(b.t, 'tr'));
  
  displayList.forEach((f) => {
    const chip = document.createElement('div');
    chip.className = `chip ${pinnedId === f.id ? 'pinned' : ''}`;
    
    // Arama için gizli veri ekliyoruz (Küçük harf başlık + emoji)
    chip.dataset.search = (f.t + f.e).toLowerCase(); 
    chip.dataset.id = f.id;
    chip.dataset.cat = f.c;
    chip.dataset.fav = f.fav;

    chip.innerHTML = `<span>${f.e}</span><span>${f.t}</span><span class="fav-star ${f.fav?'is-fav':''}" onclick="toggleFav(event, ${f.id})">★</span>`;
    
    chip.onclick = () => {
      if(pinnedId === f.id) { pinnedId = null; resetPreviews(); } 
      else { pinnedId = f.id; updatePreviews(f, true); }
      render();
    };

    chip.onmouseenter = () => { updatePreviews(f, pinnedId === f.id); };
    chip.onmouseleave = () => { 
        if (pinnedId !== null) {
            const pinnedFeel = FEELS.find(x => x.id === pinnedId);
            updatePreviews(pinnedFeel, true);
        } else { resetPreviews(); }
    };
    container.appendChild(chip);
  });
  applyFilters();
}
function pickRandomFeel() {
    // Önce arama ve kategori filtrelerini temizleyelim ki tüm listeden seçebilsin
    document.getElementById('q').value = '';
    activeCat = 'all';
    
    // Aktif kategoriyi görsel olarak da 'Tümü'ne çekelim
    document.querySelectorAll('.catbtn').forEach(b => b.classList.remove('active'));
    document.querySelector('.catbtn[data-cat="all"]').classList.add('active');
    
    // Tüm hislerden rastgele birini seç
    const randomIndex = Math.floor(Math.random() * FEELS.length);
    const randomFeel = FEELS[randomIndex];

    // Seçilen hissi sabitle (pinle)
    pinnedId = randomFeel.id;
    
    // Görünümü güncelle
    render(); 
    updatePreviews(randomFeel, true);
    
    // Kullanıcıya seçilen hissi göstermek için o çipe odaklan (scroll)
    setTimeout(() => {
        const targetChip = document.querySelector(`.chip[data-id="${randomFeel.id}"]`);
        if (targetChip) {
            targetChip.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // Seçildiğini belli etmek için hafif bir parlama efekti (opsiyonel)
            targetChip.style.boxShadow = "0 0 20px var(--accent)";
            setTimeout(() => targetChip.style.boxShadow = "none", 1000);
        }
    }, 100);
}
function updatePreviews(f, showManage) {
  if(!f) return;
  document.getElementById('p1v').innerText = `${f.e} ${f.t}`;
  document.getElementById('p2v').innerText = `(${f.e} ${f.t})`;
  document.getElementById('p3v').innerText = `💖 Eserin Hissi: ${f.t}`;
  document.getElementById('btnManage').style.display = showManage ? 'block' : 'none';
}

function resetPreviews() {
  document.getElementById('p1v').innerText = '—';
  document.getElementById('p2v').innerText = '—';
  document.getElementById('p3v').innerText = '—';
  document.getElementById('btnManage').style.display = 'none';
}

function applyFilters() {
    const q = document.getElementById('q').value.toLowerCase().trim();
    document.getElementById('clearSearch').style.display = q ? 'block' : 'none';
    let count = 0;
    
    const chips = document.querySelectorAll('.chip');
    const sortedList = [...FEELS].sort((a,b) => a.t.localeCompare(b.t, 'tr'));

    chips.forEach((chip, i) => {
        const f = sortedList[i];
        
        // ARAMA MANTIĞI DÜZELTMESİ:
        // Hem başlığı, hem emojiyi, hem de ikisinin birleşimini kontrol eder.
        const combined = (f.e + " " + f.t).toLowerCase(); 
        const matchesSearch = f.t.toLowerCase().includes(q) || 
                              f.e.includes(q) || 
                              combined.includes(q);
        
        const visible = (activeCat === 'all' || f.c === activeCat) && 
                        matchesSearch && 
                        (!favOnly || f.fav);
                        
        chip.style.display = visible ? 'flex' : 'none';
        if(visible) count++;
    });
    document.getElementById('rcStatus').innerText = `${FEELS.length} his / ${count} sonuç`;
}

function clearInput() { document.getElementById('q').value = ''; applyFilters(); document.getElementById('q').focus(); }

function saveNew(force = false) {
    const input = document.getElementById('newTitle');
    const t = input.value.trim();
    if(!t) {
        input.classList.add('error-shake');
        setTimeout(() => input.classList.remove('error-shake'), 400);
        return;
    }
    
    // Aynı isimde his var mı kontrolü
    const exists = FEELS.some(f => f.t.toLowerCase() === t.toLowerCase());

    if(exists && !force) {
        document.getElementById('confirmIcon').innerText = "⚠️";
        document.getElementById('confirmTitle').innerText = "Zaten Mevcut";
        document.getElementById('confirmMsg').innerText = `"${t}" başlığıyla bir his zaten kayıtlı. Yine de aynısından eklemek istiyor musunuz?`;
        
        document.getElementById('confirmYesBtn').onclick = () => {
            saveNew(true); // Kullanıcı 'Evet' derse zorla ekle
        };
        openModal('confirmModal');
        return;
    }

    const newId = FEELS.length > 0 ? Math.max(...FEELS.map(f => f.id)) + 1 : 1;
    FEELS.push({
        id: newId, 
        e: document.getElementById('newEmoji').value || "✨", 
        t, 
        c: document.getElementById('newCat').value, 
        fav: false
    });
    
    save(); 
    render(); 
    closeModals();
    input.value = "";
}

function updateFeel(force = false) {
    const input = document.getElementById('editTitle');
    const newT = input.value.trim();
    const newE = document.getElementById('editEmoji').value;
    const newC = document.getElementById('editCat').value;
    
    if(!newT || pinnedId === null) return;

    // Kendisi hariç aynı isimde başka bir kayıt var mı?
    const exists = FEELS.some(f => f.t.toLowerCase() === newT.toLowerCase() && f.id !== pinnedId);

    if (exists && !force) {
        document.getElementById('confirmIcon').innerText = "⚠️";
        document.getElementById('confirmTitle').innerText = "İsim Çakışması";
        document.getElementById('confirmMsg').innerText = `"${newT}" ismi başka bir his tarafından kullanılıyor. Yine de güncellemek istiyor musunuz?`;
        
        document.getElementById('confirmYesBtn').onclick = () => {
            updateFeel(true); 
        };
        openModal('confirmModal');
        return; 
    }

    const idx = FEELS.findIndex(f => f.id === pinnedId);
    if(idx !== -1) {
        FEELS[idx] = { ...FEELS[idx], e: newE, t: newT, c: newC };
        save();
        render();
        closeModals();
        updatePreviews(FEELS[idx], true);
    }
}
function deleteFeel() {
    if(pinnedId === null) return;
    const f = FEELS.find(x => x.id === pinnedId);
    document.getElementById('confirmIcon').innerText = "🗑️";
    document.getElementById('confirmTitle').innerText = "Hissi Sil?";
    document.getElementById('confirmMsg').innerText = `"${f.e} ${f.t}" hissini silmek istediğinize emin misiniz?`;
    document.getElementById('confirmYesBtn').onclick = () => {
        FEELS = FEELS.filter(x => x.id !== pinnedId);
        pinnedId = null;
        save(); render(); closeModals(); resetPreviews();
    };
    openModal('confirmModal');
}

function resetSystemPrompt() {
    document.getElementById('confirmIcon').innerText = "🔄";
    document.getElementById('confirmTitle').innerText = "Sistemi Sıfırla?";
    document.getElementById('confirmMsg').innerText = "Tüm özel veriler silinecek. Fabrika ayarlarına dönülecektir. Onaylıyor musunuz?";
    document.getElementById('confirmYesBtn').onclick = () => {
        localStorage.clear();
        location.reload();
    };
    openModal('confirmModal');
}

function showDerivativesMenu() {
    if(pinnedId === null) {
        showAlert("Seçim Gerekli", "Türev üretmek için lütfen önce bir his seçin.", "🎯");
        return;
    }
    const base = FEELS.find(x => x.id === pinnedId);
const prefixes = ["Derin", "Gizemli", "Heyecanlı", "Huzurlu", "Hüzünlü", "Işıltılı", "İlhamlı", "Kadim", "Kalpten", "Melankolik", "Mutlu", "Nostaljik", "Romantik", "Saf", "Sakin", "Sinematik", "Sonsuz", "Tatlı", "Zarif", "Mistik"];

    const listDiv = document.getElementById('derivList');
    listDiv.innerHTML = '';
    prefixes.forEach((pref, idx) => {
        const newT = `${pref} ${base.t}`;
        if(!FEELS.some(f => f.t === newT)) {
            const item = document.createElement('div');
            item.className = 'deriv-item';
            item.innerHTML = `<input type="checkbox" id="d_${idx}" data-t="${newT}" data-e="${base.e}" data-c="${base.c}"> <label for="d_${idx}">${newT}</label>`;
            item.onclick = (e) => { if(e.target.tagName !== 'INPUT') { const chk = item.querySelector('input'); chk.checked = !chk.checked; } };
            listDiv.appendChild(item);
        }
    });
    openModal('derivModal');
}

function addSelectedDerivatives() {
    const checks = document.querySelectorAll('#derivList input:checked');
    let currentMaxId = FEELS.length > 0 ? Math.max(...FEELS.map(f => f.id)) : 0;
    checks.forEach(c => { 
        FEELS.push({id: ++currentMaxId, e: c.dataset.e, t: c.dataset.t, c: c.dataset.c, fav: false}); 
    });
    save(); render(); closeModals();
}

function exportXLSX() {
    const ws = XLSX.utils.json_to_sheet(FEELS.map(f => ({Emoji:f.e, His:f.t, Kategori:f.c})));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Hisler");
    XLSX.writeFile(wb, "NRA_His_Evreni_Stok.xlsx");
}

function importXLSX(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            
            let currentMaxId = FEELS.length > 0 ? Math.max(...FEELS.map(f => f.id)) : 0;
            let addedCount = 0;
            let duplicateCount = 0;
            let skipCount = 0;

            // Gözardı edilecek başlıklar
            const headers = ["emoji", "his", "his adı", "his ismi", "kategori", "category", "title"];

            json.forEach(row => {
                // Sütun isimlerini esnek şekilde yakala
                let rawT = (row.His || row["His Adı"] || row["his ismi"] || row.title || "").toString().trim();
                let rawE = (row.Emoji || row.emoji || "✨").toString().trim();
                let rawC = (row.Kategori || row.category || "genel").toString().trim();

                // 1. BAŞLIK VE BOŞ SATIR KONTROLÜ (İstediğin kısım)
                if (!rawT || headers.includes(rawT.toLowerCase())) {
                    skipCount++;
                    return;
                }

                // 2. KATEGORİ TEMİZLEME (11 -> 7 Düşüşü Sağlar)
                let finalCat = rawC.replace(/İ/g, "i").replace(/I/g, "ı").toLowerCase().trim();

                // 3. MÜKERRER KONTROLÜ (932 -> 907 Düşüşü Sağlar)
                if (!FEELS.some(f => f.t.toLowerCase() === rawT.toLowerCase())) {
                    FEELS.push({
                        id: ++currentMaxId, 
                        e: rawE, 
                        t: rawT, 
                        c: finalCat, 
                        fav: false
                    });
                    addedCount++;
                } else {
                    duplicateCount++;
                }
            });

            // KAYDET VE GÜNCELLE
            save();
            render();
// ... importXLSX içindeki döngü bittikten sonra, save() ve render()'dan hemen sonra:

        } catch (err) {
            console.error("Hata:", err);
            alert("Excel işlenirken bir hata oluştu!");

        }
    };
    reader.readAsArrayBuffer(file);

function toggleFav(e, id) { 
    e.stopPropagation(); 
    const idx = FEELS.findIndex(x => x.id === id);
    if(idx !== -1) {
        FEELS[idx].fav = !FEELS[idx].fav; 
        save(); 
        render(); 
    }
}

function toggleFavFilter() { favOnly = !favOnly; document.getElementById('btnFavFilter').classList.toggle('active', favOnly); applyFilters(); }
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }
function copy(id) { const t = document.getElementById(id).innerText; if(t !== '—') { navigator.clipboard.writeText(t); showToast(); } }
function showToast() { const t=document.getElementById('toast'); t.style.display='block'; setTimeout(()=>t.style.display='none',1500); }
function scrollPoolToTop() { document.querySelector('.chips').scrollTo({top: 0, behavior: 'smooth'}); }

function openEditModal() {
    if(pinnedId === null) return;
    const f = FEELS.find(x => x.id === pinnedId);
    if(!f) return;
    document.getElementById('editEmoji').value = f.e;
    document.getElementById('editTitle').value = f.t;
    document.getElementById('editCat').value = f.c;
    openModal('editModal');
}

document.getElementById('cats').onclick = (e) => {
    const btn = e.target.closest('.catbtn');
    if(!btn) return;
    document.querySelectorAll('.catbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    applyFilters();
};
// Havuz içindeki (chips) kaydırmayı dinle
document.querySelector('.chips').addEventListener('scroll', function() {
    const btn = document.getElementById('poolScrollTop');

    if (this.scrollTop > 100) {
        btn.style.display = 'flex';
    } else {
        btn.style.display = 'none';
    }
});
